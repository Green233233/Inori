buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 29
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Build outputs stay inside the project (React Native's autolinking expects the
// standard build directory layout; OneDrive locks are handled by retrying builds).

apply plugin: "com.facebook.react.rootproject"
