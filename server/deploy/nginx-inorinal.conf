# /etc/nginx/sites-available/inorinal
#
# 祈（Inorinal）自建服务端反向代理。
# install.sh 把它装到 sites-available 并软链到 sites-enabled；
# 443 与证书由 install.sh 调用的 `certbot --nginx` 自动补齐。
#
# 后端只监听 127.0.0.1:8095，公网只开放 80/443。

# map 必须位于 http 上下文；sites-enabled/* 就是被 include 进 http 的。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 124-221-102-236.sslip.io;

    # 手机端媒体分块上传留的余量；服务端自身把 JSON 体限制在 1 MiB。
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;

        # 长轮询最长 300s（server/app/relay.py MAX_WAIT_SECONDS），
        # 读超时多留 20s，避免长轮询被 504 掐断。
        proxy_connect_timeout 10s;
        proxy_send_timeout 320s;
        proxy_read_timeout 320s;

        # 保留 Upgrade 头：现在没有 WS，将来加不用再改配置。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长轮询响应要尽快下发，禁止 nginx 攒包。
        proxy_buffering off;
    }
}
