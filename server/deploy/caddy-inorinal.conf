#
# 祈（Inorinal）服务端：443 上的公共域名，证书由 Caddy 自动申请
# （Let's Encrypt / HTTP-01，需要 80 端口从公网可达）。
# 只在 80/443 已被 Caddy 占用（而不是 nginx）的主机上使用。
# 若 80/443 被云厂商按“未备案域名”拦截（HTTP 返回 webblock、443 按 SNI 重置），
# 改用：INORINAL_CADDY_PORT=8443 INORINAL_CADDY_TLS=internal，
# 脚本会改写成 https://<域名>:8443 + 10 年自签证书（App 需 pin）。
# 本块由 install.sh 整块替换，不要手工改中间内容。
https://124-221-102-236.sslip.io {
	encode zstd gzip

	# 后端长轮询最长 300s：关闭响应缓冲，等多久就挂多久。
	reverse_proxy 127.0.0.1:8095 {
		flush_interval -1
	}
}
